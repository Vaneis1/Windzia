<title>Windzia Makiety</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Układ: nieskończone płótno (przesuwanie + zoom) z trzema planszami 1440×960 obok siebie.
   Każda plansza = stały lewy panel (288px) + obszar strony głównej w innym wariancie. */
:root{
  --f-display:'Alegreya SC',Georgia,serif;
  --f-body:'Alegreya Sans',system-ui,'Segoe UI',sans-serif;
  --canvas:#D5DCD8; --canvas-dot:#BAC5BF;
  --bar:#F1F4F1; --bar-ink:#1A262B;
  --panel:#ECF0ED; --panel-2:#DFE6E2; --surface:#F4F6F3; --card:#FBFCFA; --board:#C8D1CC;
  --ink:#1A262B; --ink-2:#53635F; --line:#BCC7C1; --line-2:#D3DBD6;
  --accent:#8A5A12; --accent-bg:#EEDDB8; --on-accent:#FFFFFF;
  --mg:#9B2C32; --mg-bg:#F1D8D6; --ok:#2B7A4B;
  --t-news:#53635F; --t-holiday:#7B4DA0; --t-event:#1E6E8C; --t-recruit:#2B7A4B;
  --p-karczma:#C0562F; --p-targ:#C29516; --p-gildia:#3E7CB1; --p-twierdza:#6A7683; --p-las:#3F8F5A; --p-swiatynia:#8E5BB5;
  --shadow:0 1px 2px rgba(20,30,30,.12),0 8px 24px rgba(20,30,30,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0B1013; --canvas-dot:#1B262B;
  --bar:#141C20; --bar-ink:#E4EAE6;
  --panel:#151E22; --panel-2:#1D282D; --surface:#101719; --card:#1B262A; --board:#0D1417;
  --ink:#E4EAE6; --ink-2:#9DAEA9; --line:#2D3B41; --line-2:#222F34;
  --accent:#E0A64B; --accent-bg:#3A2D14; --on-accent:#1A1408;
  --mg:#F08A84; --mg-bg:#3C1E21; --ok:#5CC48A;
  --t-news:#9DAEA9; --t-holiday:#B895DB; --t-event:#5CB6D6; --t-recruit:#5CC48A;
  --p-karczma:#E0825A; --p-targ:#DDB43F; --p-gildia:#6AA3D6; --p-twierdza:#98A4B1; --p-las:#69B987; --p-swiatynia:#B58BDA;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0B1013; --canvas-dot:#1B262B;
  --bar:#141C20; --bar-ink:#E4EAE6;
  --panel:#151E22; --panel-2:#1D282D; --surface:#101719; --card:#1B262A; --board:#0D1417;
  --ink:#E4EAE6; --ink-2:#9DAEA9; --line:#2D3B41; --line-2:#222F34;
  --accent:#E0A64B; --accent-bg:#3A2D14; --on-accent:#1A1408;
  --mg:#F08A84; --mg-bg:#3C1E21; --ok:#5CC48A;
  --t-news:#9DAEA9; --t-holiday:#B895DB; --t-event:#5CB6D6; --t-recruit:#5CC48A;
  --p-karczma:#E0825A; --p-targ:#DDB43F; --p-gildia:#6AA3D6; --p-twierdza:#98A4B1; --p-las:#69B987; --p-swiatynia:#B58BDA;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- płótno ---------- */
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--canvas-dot) 1.4px,transparent 1.6px);background-size:28px 28px}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:4560px;height:1050px;transform-origin:0 0}
#world.anim{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){#world.anim{transition:none}}
.vlabel{position:absolute;top:0;width:1440px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.vlabel b{font:700 34px/1 var(--f-display);letter-spacing:.02em}
.vlabel span{font-size:19px;color:var(--ink-2);max-width:980px}
.bd{position:absolute;top:90px;width:1440px;height:960px;display:grid;grid-template-columns:288px 1fr;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;
  font-size:15px;line-height:1.3;user-select:none;cursor:default}

/* ---------- pasek narzędzi ---------- */
#bar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;
  padding:10px 16px;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top,0px))}
#bar h1{margin:0;font:700 20px/1 var(--f-display);letter-spacing:.03em;white-space:nowrap}
#bar h1 small{font:500 14px var(--f-body);color:var(--ink-2);letter-spacing:0;margin-left:10px}
.grp{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{padding:6px 12px;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.spacer{flex:1}
#dock{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:4px;padding:6px;background:var(--bar);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
#dock button{padding:6px 11px;border-radius:6px;font-size:14px;min-width:34px;text-align:center;color:var(--bar-ink)}
#dock button:hover{background:var(--panel-2)}
#dock .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#zl{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2)}
#hint{position:absolute;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:4;font-size:13px;color:var(--ink-2);max-width:240px;text-align:right;pointer-events:none}
@media (max-width:900px){#hint{display:none}}

/* ---------- elementy wspólne ---------- */
.ex{font:700 10px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.ex.draft{color:var(--mg);border-color:var(--mg)}
.tc{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tc i{font-style:normal;font-size:11px}
.t-news{color:var(--t-news)}.t-holiday{color:var(--t-holiday)}.t-event{color:var(--t-event)}.t-recruit{color:var(--t-recruit)}
.pt{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink);background:var(--panel-2);border-radius:999px;padding:3px 10px 3px 8px;white-space:nowrap}
.pt i{width:9px;height:9px;border-radius:50%;flex:none}
.d-karczma{background:var(--p-karczma)}.d-targ{background:var(--p-targ)}.d-gildia{background:var(--p-gildia)}.d-twierdza{background:var(--p-twierdza)}.d-las{background:var(--p-las)}.d-swiatynia{background:var(--p-swiatynia)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:500;color:var(--ink)}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn.done{background:transparent;color:var(--ok);border-color:var(--ok)}
.btn.sm{padding:3px 9px;font-size:13px}
h2.sec{margin:0;font:700 19px/1.1 var(--f-display);letter-spacing:.03em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink-2);font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--surface)}
.chip.off{opacity:.55;text-decoration:line-through}
.chip i.dot{width:9px;height:9px;border-radius:50%}
.chip .g{font-size:11px;font-style:normal}
.chip[aria-pressed="true"] .g{color:inherit}
.lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- lewy panel ---------- */
.lp{background:var(--panel);border-right:1px solid var(--line);padding:14px 12px 12px;display:flex;flex-direction:column;gap:10px;min-height:0;position:relative}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px 2px}
.brand .lg{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 19px var(--f-display)}
.brand b{font:700 22px/1 var(--f-display);letter-spacing:.04em}
.brand span{margin-left:auto}
.lp h4{margin:0 0 4px;padding:0 4px;display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.lp ul{list-style:none;margin:0;padding:0}
.who li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:3px 6px;border-radius:7px}
.who li.me{background:var(--panel-2)}
.av{width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font:700 13px var(--f-display);position:relative}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.who b{display:block;font-size:14px;font-weight:700;line-height:1.1}
.who small{font-size:12.5px;color:var(--ink-2)}
.mgb{font:700 10px/1 var(--f-body);letter-spacing:.1em;color:var(--mg);background:var(--mg-bg);border-radius:4px;padding:3px 5px}
.menu li button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:4px 8px;border-radius:6px;font-size:15px;font-weight:500}
.menu li button:hover{background:var(--panel-2)}
.menu li button[aria-current="page"]{background:var(--accent-bg);font-weight:700}
.menu li button em{font-style:normal;font-size:12px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.menu .mgsub{display:block;margin:6px 4px 2px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--mg)}
.charbox{margin-top:auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;position:relative}
.charbox .cur{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center}
.charbox .cur .av{width:38px;height:38px;font-size:17px}
.charbox .cur .av::after{display:none}
.charbox .cur b{display:block;font:700 17px/1.1 var(--f-display);letter-spacing:.02em}
.charbox .cur small{font-size:13px;color:var(--ink-2)}
.charbox .cb-note{font-size:12px;color:var(--ink-2)}
.chlist{position:absolute;left:-1px;right:-1px;bottom:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:3}
.chlist .gh{display:block;padding:4px 8px 2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.chlist button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:14.5px}
.chlist button:hover{background:var(--panel-2)}
.chlist button small{display:block;color:var(--ink-2);font-size:12px}
.chlist button[aria-checked="true"]{background:var(--accent-bg);font-weight:700}

/* ---------- obszar główny ---------- */
.main{padding:26px 32px 26px;min-width:0;min-height:0;display:flex;flex-direction:column;gap:16px;overflow:hidden;position:relative}
.mh{display:flex;align-items:flex-end;gap:16px;flex:none}
.mh h1{margin:0;font:700 34px/1 var(--f-display);letter-spacing:.02em}
.mh .sub{color:var(--ink-2);font-size:15px;padding-bottom:3px}
.mh .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.rolechip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:var(--ink-2)}
.rolechip.mg{background:var(--mg-bg);color:var(--mg)}
.filters{display:flex;flex-direction:column;gap:8px;flex:none}
.frow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.frow .lbl{width:52px}
.clear{font-size:13px;color:var(--ink-2);text-decoration:underline;padding:4px}

/* Dla mnie */
.me-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.me-card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.me-card header small{font-size:13px;color:var(--ink-2)}
.fm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.fm li{display:grid;grid-template-columns:20px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line-2)}
.fm li:first-child{border-top:0;padding-top:2px}
.fm .k{font-size:13px;padding-top:1px;text-align:center}
.fm b{display:block;font-size:15px;font-weight:700;line-height:1.2}
.fm small{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:13px;color:var(--ink-2)}
.fm .new{font:700 10px/1 var(--f-body);letter-spacing:.1em;background:var(--accent);color:var(--on-accent);padding:2px 5px;border-radius:4px}
.k-recruit{color:var(--t-recruit)}.k-event{color:var(--t-event)}.k-holiday{color:var(--t-holiday)}.k-news{color:var(--t-news)}.k-msg{color:var(--accent)}.k-task{color:var(--mg)}

/* kalendarz */
.cal{display:flex;flex-direction:column;gap:8px;min-height:0}
.cal .nav{display:flex;align-items:center;justify-content:space-between}
.cal .nav b{font:700 18px var(--f-display);letter-spacing:.03em}
.cal .nav button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);text-align:center;background:var(--panel)}
.mg-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mg-grid .dn{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:center;padding-bottom:2px}
.mg-grid .dc{border-radius:6px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding-top:4px;font-size:13px;font-variant-numeric:tabular-nums}
.mg-grid .dc.past{opacity:.45}
.mg-grid .dc.today{outline:2px solid var(--accent);font-weight:700}
.mg-grid .dc.void{background:transparent}
.mg-grid .dc .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}
.mg-grid .dc .dots i{width:7px;height:7px;border-radius:50%}
.dt-news{background:var(--t-news)}.dt-holiday{background:var(--t-holiday)}.dt-event{background:var(--t-event)}.dt-recruit{background:var(--t-recruit)}
.ag{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ag li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line-2);align-items:start}
.ag .dd{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.ag .dd small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.ag b{display:block;font-size:14.5px;line-height:1.15;margin-bottom:3px}
.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);text-align:center;font-size:14.5px}

/* ===== Wariant A: tablica ===== */
.a-row{display:grid;grid-template-columns:1fr 344px;gap:20px;flex:1;min-height:0}
.a-board{background:var(--board);border:1px solid var(--line);border-radius:12px;padding:26px 26px 14px;display:flex;flex-direction:column;gap:12px;min-height:0;
  background-image:radial-gradient(var(--line-2) 1px,transparent 1.2px);background-size:14px 14px;box-shadow:inset 0 2px 8px rgba(0,0,0,.14)}
.a-notes{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:22px 20px;flex:1;min-height:0}
.note{position:relative;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:20px 16px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 0 rgba(0,0,0,.08),0 8px 14px rgba(0,0,0,.14);min-height:0;overflow:hidden}
.note:nth-child(3n+1){transform:rotate(-.7deg)}.note:nth-child(3n+2){transform:rotate(.5deg)}.note:nth-child(3n){transform:rotate(-.3deg)}
.note::before{content:"";position:absolute;top:7px;left:50%;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:var(--accent);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.3)}
.note .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.note h3{margin:0;font:700 21px/1.08 var(--f-display);letter-spacing:.01em}
.note p{margin:0;font-size:15px;color:var(--ink-2);line-height:1.3}
.note .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.note .when{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.a-foot{display:flex;justify-content:space-between;align-items:center;color:var(--ink-2);font-size:13px;flex:none}
.a-side{display:flex;flex-direction:column;gap:14px;min-height:0}
.a-side .me-card:first-child{flex:1}.a-side .me-card:last-child{flex:none}

/* ===== Wariant B: księga ===== */
.b-me{display:grid;grid-template-columns:150px repeat(4,1fr);gap:12px;flex:none}
.b-me .hd{display:flex;flex-direction:column;justify-content:center;gap:4px}
.b-me .hd small{color:var(--ink-2);font-size:13px;line-height:1.25}
.b-mi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.b-mi b{font-size:14.5px;line-height:1.2}
.b-mi small{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.b-book{flex:1;min-height:0;display:grid;grid-template-columns:1.2fr 1fr 148px;gap:0;position:relative}
.page{background:var(--card);border:1px solid var(--line);padding:18px 22px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.page.l{border-radius:12px 0 0 12px;border-right:0;background-image:linear-gradient(to left,rgba(0,0,0,.09),transparent 34px)}
.page.r{border-radius:0 12px 12px 0;background-image:linear-gradient(to right,rgba(0,0,0,.09),transparent 34px)}
.page .ph{display:flex;justify-content:space-between;align-items:center;gap:10px}
.page .tf{display:flex;gap:6px;flex-wrap:wrap}
.led{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;min-height:0}
.led li{display:grid;grid-template-columns:96px 1fr auto;gap:12px;padding:9px 0;border-top:1px solid var(--line-2);align-items:start}
.led li:first-child{border-top:0}
.led .c1{display:flex;flex-direction:column;gap:3px;font-size:13px}
.led .c1 .w{font-weight:700;font-variant-numeric:tabular-nums}
.led h3{margin:0 0 2px;font:700 18px/1.1 var(--f-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.led p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.led .c3{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tabs{display:flex;flex-direction:column;gap:6px;padding:14px 0 0 0}
.tabs button{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:0 9px 9px 0;border:1px solid var(--line);border-left:0;background:var(--panel);font-size:14px;font-weight:500;line-height:1.1;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--accent-bg);color:var(--ink);font-weight:700;margin-right:-1px;padding-right:14px}
.tabs button i{width:9px;height:9px;border-radius:50%;flex:none}

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ---------- DANE PRZYKŁADOWE (do zastąpienia prawdziwymi) ---------- */

 {id:9,type:'event',place:'twierdza',d:'2026-10-22',time:'19:00',title:'Wyprawa po zaginioną karawanę',body:'Zbiórka przy bramie. Potrzebni zwiadowcy i uzdrowiciel.',slots:'4/6 miejsc'},

 {id:11,type:'recruit',place:'swiatynia',d:'2026-10-16',title:'Bard na święto Wichru',body:'Świątynia szuka kogoś do prowadzenia pieśni procesji.',slots:'1 wolne',apps:1},
 {id:12,type:'holiday',place:'targ',d:'2026-11-08',title:'Dzień Kowali',body:'Pokazy kucia, darmowe ostrzenie noży dla mieszkańców.'},
 {id:13,type:'news',place:'las',ago:'3 dni temu',title:'Las Szeptów otwarty',body:'Straż zniosła zakaz wstępu. Leśnicy proszą o ostrożność po zmroku.'},
 {id:14,type:'recruit',place:'las',d:'2026-11-05',title:'Przewodnik po Lesie Szeptów',body:'Leśnicy szukają kogoś, kto zna ścieżki i nie boi się nocy.',slots:'2 wolne',apps:0},
 {id:15,type:'event',place:'gildia',d:'2026-10-28',time:'18:00',title:'Pokaz atlasów',body:'Gildia pokazuje trzy atlasy z archiwum. Wstęp na zaproszenie.'}
];
const CH={
 elwira:{n:'Elwira Zimnowłos',sub:'Człowiek, złodziejka · poz. 4'},
 dagmara:{n:'Dagmara Cień',sub:'Półelfka, łuczniczka · poz. 3'},
 hubert:{n:'Brat Hubert',sub:'Człowiek, kapłan · poz. 2'},
 narrator:{n:'Narrator',sub:'Głos Mistrza Gry'},
 ilsa:{n:'Ilsa Karczmarka',sub:'NPC · Pod Kruczym Piórem'},
 brama:{n:'Brama, strażnik',sub:'NPC · Twierdza Szarej Straży'}};
const LIST={player:['elwira','dagmara','hubert'],mg:['narrator','ilsa','brama']};
const DN=['niedz.','pon.','wt.','śr.','czw.','pt.','sob.'];
const dd=iso=>{const d=new Date(iso+'T00:00:00Z');return DN[d.getUTCDay()]+' '+String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0')};
const byId=id=>E.find(e=>e.id===id);
const when=e=>e.type==='news'?e.ago:e.type==='recruit'?'do '+dd(e.d):e.type==='event'?dd(e.d)+' · '+e.time:dd(e.d)+' · cały dzień';
const ME={
 elwira:[
  {k:'recruit',b:'Zgłoszenie do Straży Szarej czeka na decyzję MG',m:'wysłano 10.10',p:'twierdza'},
  {k:'event',b:'Jesteś zapisana/y na Turniej w kości',m:when(byId(2)),p:'karczma'},
  {k:'msg',b:'Ilsa Karczmarka zostawiła Ci wiadomość',m:'nowa',p:'karczma',u:1},
  {k:'holiday',b:'Dzień Pierwszego Wichru: masz miejsce w procesji',m:when(byId(1)),p:'swiatynia'},
  {k:'task',b:'Uzupełnij historię postaci',m:'karta postaci'}],
 dagmara:[
  {k:'task',b:'Awans na poziom 4 czeka na zatwierdzenie',m:'karta postaci',u:1},
  {k:'news',b:'Zaginiony ładunek na Targowisku wspomina Twoją postać',m:'wczoraj',p:'targ'}],
 hubert:[
  {k:'holiday',b:'Prowadzisz modlitwę na Dzień Pierwszego Wichru',m:when(byId(1)),p:'swiatynia',u:1},
  {k:'recruit',b:'Bard na święto Wichru: kandydatura do oceny',m:'do '+dd('2026-10-16'),p:'swiatynia'}],
 narrator:[
  {k:'task',b:'3 zgłoszenia rekrutacyjne czekają na decyzję',m:'Twierdza, Gildia, Świątynia',u:1},
  {k:'task',b:'Noc Szeptów to szkic, nie jest opublikowana',m:'szkic',p:'las'},
  {k:'event',b:'Turniej w kości: zajęte 6 z 8 miejsc',m:when(byId(2)),p:'karczma'},
  {k:'task',b:'Brak przygotowanej sceny na sesję w sobotę',m:dd('2026-10-17')},
  {k:'news',b:'Podsumowanie sesji nr 14 czeka na publikację',m:'wczoraj',p:'twierdza'}],
 ilsa:[
  {k:'msg',b:'Elwira pytała o wolny pokój na piętrze',m:'dziś',p:'karczma',u:1},
  {k:'event',b:'Przygotuj nagrody na Turniej w kości',m:when(byId(2)),p:'karczma'}],
 brama:[
  {k:'recruit',b:'Prowadzisz rozmowy w naborze do Straży',m:'5 zgłoszeń',p:'twierdza',u:1},
  {k:'task',b:'NPC nie ma jeszcze opisu wyglądu',m:'karta NPC'}]};
const KG={recruit:'■',event:'●',holiday:'◆',news:'▲',msg:'✉',task:'☐'};

/* ---------- STAN ---------- */
const S={role:'player',char:{player:'elwira',mg:'narrator'},open:{},joined:new Set(),
  b:{A:{place:'all',types:['news','holiday','event','recruit'],month:9},
     B:{place:'all',types:['news','holiday','event','recruit'],month:9},
     C:{place:'all',types:['news','holiday','event','recruit'],month:9}}};
const cur=()=>S.char[S.role];
const vis=()=>E.filter(e=>S.role==='mg'||!e.draft);
const flt=(bs,ignoreType)=>vis().filter(e=>(bs.place==='all'||e.place===bs.place)&&(ignoreType||bs.types.includes(e.type)));

/* ---------- KLOCKI ---------- */
const ptag=id=>`<span class="pt"><i class="d-${id}"></i>${PL[id].s}</span>`;
const tchip=t=>`<span class="tc t-${t}"><i>${TY[t].g}</i>${TY[t].n}</span>`;
const exTag=e=>`<span class="ex${e.draft?' draft':''}">${e.draft?'Szkic MG':'Przykład'}</span>`;
function act(e,sm){
  if(e.type==='news')return '';
  const on=S.joined.has(e.id);
  const lab=e.type==='recruit'?['Złóż zgłoszenie','Zgłoszono ✓']:e.type==='event'?['Zapisz się','Zapisano ✓']:['Przypomnij','Przypomnimy ✓'];
  return `<button class="btn ${sm?'sm ':''}${on?'done':''}" data-act="join" data-v="${e.id}">${lab[on?1:0]}</button>`;
}
function mgmeta(e){return S.role==='mg'&&e.type==='recruit'?`<span class="ex draft">MG · zgłoszeń: ${e.apps}</span>`:''}

function lpanel(id){
  const c=cur(),role=S.role;
  const rows=[
    {n:role==='mg'?CH[c].n:'Narrator',p:'Wojtek',mg:1,me:role==='mg'},
    {n:role==='player'?CH[c].n:CH[S.char.player].n,p:'Kasia',me:role==='player'},
    {n:'Borgrim Kowal',p:'Tomek'},{n:'Sylwen z Gaju',p:'Ola'},{n:'Kruk',p:'Piotr'}];
  const who=rows.map(r=>`<li class="${r.me?'me':''}"><span class="av">${r.n[0]}</span><span><b>${r.n}</b><small>${r.p}${r.me?' (Ty)':''}</small></span>${r.mg?'<span class="mgb">MG</span>':''}</li>`).join('');
  const mm=['Strona główna','Postacie','Sesje','Świat i miejsca','Kalendarz','Dziennik'].map((t,i)=>`<li><button ${i===0?'aria-current="page"':''}>${t}</button></li>`).join('');
  const nMe=ME[c].length;
  const cx=[['Wszystkie nowości',''],['Dla mnie',nMe],['Kalendarz miejsc',''],['Rekrutacje',''],['Archiwum ogłoszeń','']]
    .map((t,i)=>`<li><button ${i===0?'aria-current="page"':''}>${t[0]}${t[1]!==''?`<em>${t[1]}</em>`:''}</button></li>`).join('');
  const cxm=role==='mg'?`<li><span class="mgsub">Mistrz Gry</span></li><li><button>Nowe ogłoszenie</button></li><li><button>Zgłoszenia do decyzji<em>3</em></button></li><li><button>Szkice<em>1</em></button></li>`:'';
  const open=S.open[id];
  const opt=k=>`<button role="menuitemradio" aria-checked="${k===c}" data-act="pick" data-v="${k}"><span>${CH[k].n}<small>${CH[k].sub}</small></span>${k===c?'✓':''}</button>`;
  const list=role==='player'
    ? `<span class="gh">Moje postacie</span>${LIST.player.map(opt).join('')}`
    : `<span class="gh">Mistrz Gry</span>${opt('narrator')}<span class="gh">NPC dołączeni do sesji</span>${opt('ilsa')}${opt('brama')}`;
  return `<aside class="lp">
   <div class="brand"><span class="lg">W</span><b>Windzia</b><span class="ex">makieta</span></div>
   <section><h4>Aktywni gracze <span>${rows.length} w grze</span></h4><ul class="who">${who}</ul></section>
   <nav aria-label="Menu główne"><h4>Menu główne</h4><ul class="menu">${mm}</ul></nav>
   <nav aria-label="Menu strony"><h4>Strona główna</h4><ul class="menu">${cx}${cxm}</ul></nav>
   <section class="charbox">
     ${open?`<div class="chlist" role="menu">${list}</div>`:''}
     <span class="lbl">${role==='mg'?'Mówię jako':'Aktualna postać'}</span>
     <div class="cur"><span class="av">${CH[c].n[0]}</span><span><b>${CH[c].n}</b><small>${CH[c].sub}</small></span></div>
     <button class="btn" data-act="chtoggle" aria-expanded="${!!open}">Zmień postać ▾</button>
     <span class="cb-note">${role==='mg'?'Narrator i NPC z tej sesji. Postać zmienisz tylko tutaj.':'Postać zmienisz tylko tutaj.'}</span>
   </section></aside>`;
}

function header(){
  const c=cur();
  return `<header class="mh"><h1>Strona główna</h1><span class="sub">Dziś pon. 12.10.2026 · ${S.role==='mg'?'Mówisz jako':'Grasz jako'} ${CH[c].n}</span>
   <div class="r"><span class="ex">Dane przykładowe</span>${S.role==='mg'?'<button class="btn pri">+ Nowe ogłoszenie</button>':''}<span class="rolechip ${S.role==='mg'?'mg':''}">Podgląd: ${S.role==='mg'?'Mistrz Gry':'Gracz'}</span></div></header>`;
}
function fm(n){
  const items=ME[cur()].slice(0,n||9);
  return `<ul class="fm">${items.map(i=>`<li><span class="k k-${i.k}">${KG[i.k]}</span><div><b>${i.b}</b><small>${i.u?'<span class="new">NOWE</span>':''}${i.m}${i.p?ptag(i.p):''}</small></div></li>`).join('')}</ul>`;
}
function meCard(n,title){
  return `<section class="me-card"><header><h2 class="sec">${title||'Dla mnie'}</h2><small>${CH[cur()].n}</small></header>${fm(n)}</section>`;
}
function filters(id,opts={}){
  const bs=S.b[id];
  const pl=flt({place:'all',types:bs.types});
  const placeChips=`<button class="chip" aria-pressed="${bs.place==='all'}" data-act="place" data-b="${id}" data-v="all">Wszystkie <b>${pl.length}</b></button>`+
   Object.keys(PL).map(p=>`<button class="chip" aria-pressed="${bs.place===p}" data-act="place" data-b="${id}" data-v="${p}"><i class="dot d-${p}"></i>${PL[p].s} <b>${pl.filter(e=>e.place===p).length}</b></button>`).join('');
  return `<div class="filters">
   <div class="frow"><span class="lbl">Miejsce</span>${placeChips}</div>
   ${typeRow(id)}</div>`;
}
function typeRow(id){
  const bs=S.b[id];
  const pool=flt({place:bs.place,types:[]},true);
  const chips=Object.keys(TY).map(t=>{const on=bs.types.includes(t);
   return `<button class="chip ${on?'':'off'}" aria-pressed="${on}" data-act="type" data-b="${id}" data-v="${t}"><span class="g t-${t}" style="font-style:normal">${TY[t].g}</span>${TY[t].n} <b>${pool.filter(e=>e.type===t).length}</b></button>`}).join('');
  return `<div class="frow"><span class="lbl">Typ</span>${chips}</div>`;
}
function monthGrid(id,es){
  const bs=S.b[id],m=bs.month;
  const off=(new Date(Date.UTC(2026,m,1)).getUTCDay()+6)%7,days=new Date(Date.UTC(2026,m+1,0)).getUTCDate();
  const by={};
  es.filter(e=>e.d&&e.type!=='news').forEach(e=>{const dt=new Date(e.d+'T00:00:00Z');if(dt.getUTCMonth()===m)(by[dt.getUTCDate()]=by[dt.getUTCDate()]||[]).push(e)});
  let h=['pn','wt','śr','cz','pt','sb','nd'].map(x=>`<div class="dn">${x}</div>`).join('');
  for(let i=0;i<off;i++)h+='<div class="dc void"></div>';
  for(let d=1;d<=days;d++){
    const past=m===9&&d<12,today=m===9&&d===12;
    h+=`<div class="dc ${past?'past':''} ${today?'today':''}"><span>${d}</span><span class="dots">${(by[d]||[]).map(e=>`<i class="dt-${e.type}" title="${e.title}"></i>`).join('')}</span></div>`;
  }
  return `<div class="cal"><div class="nav"><button data-act="month" data-b="${id}" data-v="-1" aria-label="Poprzedni miesiąc">‹</button><b>${m===9?'Październik':'Listopad'} 2026</b><button data-act="month" data-b="${id}" data-v="1" aria-label="Następny miesiąc">›</button></div><div class="mg-grid">${h}</div></div>`;
}
function upcoming(id,n){
  const bs=S.b[id];
  const es=flt({place:bs.place,types:bs.types}).filter(e=>e.type!=='news'&&e.d>='2026-10-12').sort((a,b)=>a.d.localeCompare(b.d)).slice(0,n);
  if(!es.length)return `<div class="empty">Brak nadchodzących wpisów w tym miejscu.</div>`;
  return `<ul class="ag">${es.map(e=>`<li><span class="dd">${dd(e.d)}<small>${e.time||(e.type==='recruit'?'termin':'cały dzień')}</small></span><div><b>${e.title}</b>${tchip(e.type)} ${bs.place==='all'?ptag(e.place):''}</div></li>`).join('')}</ul>`;
}
const placeName=bs=>bs.place==='all'?'wszystkie miejsca':PL[bs.place].s;

/* ---------- WARIANT A: tablica ---------- */
function viewA(){
  const id='A',bs=S.b[id],es=flt(bs),shown=es.slice(0,6);
  const notes=shown.length?shown.map(e=>`<article class="note"><div class="top">${tchip(e.type)}${exTag(e)}</div>
    <h3>${e.title}</h3><p>${e.body}</p>
    <div class="ft">${ptag(e.place)}<span class="when">${when(e)}</span></div>
    <div class="ft">${act(e,1)}${e.slots?`<span class="when">${e.slots}</span>`:''}${mgmeta(e)}</div></article>`).join('')
   :`<div class="empty" style="grid-column:1/-1;align-self:start">Brak wpisów dla tego miejsca i typu. Zmień filtr.</div>`;
  return `<main class="main">${header()}${filters(id)}
   <div class="a-row">
    <section class="a-board" aria-label="Tablica ogłoszeń"><div class="a-notes">${notes}</div>
      <div class="a-foot"><span>Pokazano ${shown.length} z ${es.length} wpisów</span><button class="clear" data-act="reset" data-b="${id}">Wyczyść filtry</button></div></section>
    <aside class="a-side">
      ${meCard(4)}
      <section class="me-card"><header><h2 class="sec">Kalendarz</h2><small>${placeName(bs)}</small></header>${monthGrid(id,flt({place:bs.place,types:bs.types}))}${upcoming(id,2)}</section>
    </aside></div></main>`;
}

/* ---------- WARIANT B: księga ---------- */
function viewB(){
  const id='B',bs=S.b[id],es=flt(bs),shown=es.slice(0,5);
  const mine=ME[cur()].slice(0,4).map(i=>`<div class="b-mi"><span class="k-${i.k}" style="font-size:13px">${KG[i.k]} ${i.u?'<span class="new" style="font:700 10px var(--f-body);background:var(--accent);color:var(--on-accent);padding:2px 5px;border-radius:4px;letter-spacing:.1em">NOWE</span>':''}</span><b>${i.b}</b><small>${i.m}${i.p?ptag(i.p):''}</small></div>`).join('');
  const rows=shown.length?shown.map(e=>`<li><div class="c1"><span class="w">${when(e)}</span>${tchip(e.type)}</div>
    <div><h3>${e.title}</h3><p>${e.body}</p></div>
    <div class="c3">${ptag(e.place)}${act(e,1)}${mgmeta(e)}${exTag(e)}</div></li>`).join(''):`<div class="empty">Brak wpisów dla tego miejsca i typu.</div>`;
  const all=flt({place:'all',types:bs.types});
  const tabs=`<button aria-pressed="${bs.place==='all'}" data-act="place" data-b="${id}" data-v="all">Wszystkie<b>${all.length}</b></button>`+
    Object.keys(PL).map(p=>`<button aria-pressed="${bs.place===p}" data-act="place" data-b="${id}" data-v="${p}"><i class="d-${p}"></i>${PL[p].s}<b>${all.filter(e=>e.place===p).length}</b></button>`).join('');
  return `<main class="main">${header()}
   <section class="b-me" aria-label="Dla mnie"><div class="hd"><h2 class="sec">Dla mnie</h2><small>Sprawy postaci: ${CH[cur()].n}</small></div>${mine}</section>
   <div class="b-book">
    <section class="page l"><div class="ph"><h2 class="sec">Nowości i ogłoszenia</h2><span class="lbl">pokazano ${shown.length} z ${es.length} · ${placeName(bs)}</span></div>
      <div class="tf">${typeRow(id).replace('<div class="frow"><span class="lbl">Typ</span>','').replace(/<\/div>$/,'')}</div>
      <ul class="led">${rows}</ul></section>
    <section class="page r"><div class="ph"><h2 class="sec">Kalendarz: ${placeName(bs)}</h2></div>
      ${monthGrid(id,flt({place:bs.place,types:bs.types}))}
      <span class="lbl">Najbliższe terminy</span>${upcoming(id,3)}</section>
    <nav class="tabs" aria-label="Miejsca">${tabs}</nav>
   </div></main>`;
}

/* ---------- WARIANT C: mapa miejsc ---------- */
const NP={karczma:[20,40],targ:[246,22],gildia:[462,50],twierdza:[528,140],las:[296,150],swiatynia:[40,150]};
function viewC(){
  const id='C',bs=S.b[id];
  const pool=flt({place:'all',types:bs.types},true);
  const tchips=Object.keys(TY).map(t=>{const on=bs.types.includes(t);return `<button class="chip ${on?'':'off'}" aria-pressed="${on}" data-act="type" data-b="${id}" data-v="${t}"><span class="g t-${t}" style="font-style:normal">${TY[t].g}</span>${TY[t].n}</button>`}).join('');
  const keys=Object.keys(PL);
  const nodes=keys.map(p=>{const pe=pool.filter(e=>e.place===p);const n=t=>pe.filter(e=>e.type===t).length;
    return `<button class="node" style="left:${NP[p][0]}px;top:${NP[p][1]}px" aria-pressed="${bs.place===p}" data-act="place" data-b="${id}" data-v="${p}"><b><i class="d-${p}"></i>${PL[p].s}</b>
     <span class="cn"><span class="t-holiday" title="Święta"><em>◆</em>${n('holiday')}</span><span class="t-event" title="Eventy"><em>●</em>${n('event')}</span><span class="t-recruit" title="Rekrutacje"><em>■</em>${n('recruit')}</span><span class="t-news" title="Nowości"><em>▲</em>${n('news')}</span></span></button>`}).join('');
  const ctr=p=>[NP[p][0]+88,NP[p][1]+30];
  const link=(a,b)=>{const A=ctr(a),B=ctr(b);return `<path d="M${A[0]} ${A[1]} Q${(A[0]+B[0])/2} ${(A[1]+B[1])/2-26} ${B[0]} ${B[1]}"/>`};
  const svg=`<svg viewBox="0 0 724 236" preserveAspectRatio="none" aria-hidden="true">${link('karczma','targ')}${link('targ','gildia')}${link('gildia','twierdza')}${link('karczma','swiatynia')}${link('swiatynia','las')}${link('las','twierdza')}${link('targ','las')}</svg>`;
  const up=flt({place:bs.place,types:bs.types}).filter(e=>e.type!=='news'&&e.d>='2026-10-12').sort((a,b)=>a.d.localeCompare(b.d)).slice(0,4);
  const strip=up.length?up.map(e=>`<div class="sc"><span class="dt t-${e.type}">${TY[e.type].g} ${dd(e.d)}</span><b>${e.title}</b>${bs.place==='all'?ptag(e.place):''}</div>`).join(''):`<div class="empty" style="grid-column:1/-1">Brak nadchodzących terminów w tym miejscu.</div>`;
  const news=flt({place:bs.place,types:['news']}).slice(0,3);
  const newsRow=bs.types.includes('news')?`<div class="c-news">${news.length?news.map(e=>`<div class="nw"><b>▲ ${e.title}</b><small>${ptag(e.place)}${e.ago}</small></div>`).join(''):'<div class="nw"><small>Brak nowości w tym miejscu.</small></div>'}</div>`:'';
  const colTypes=['holiday','event','recruit'].filter(t=>bs.types.includes(t));
  const cols=colTypes.map(t=>{const es=flt({place:bs.place,types:[t]}).slice(0,3);
    return `<div class="col t-${t}"><div class="ch"><b>${t==='holiday'?'Święta':t==='event'?'Eventy':'Rekrutacje'}</b><span class="lbl">${flt({place:bs.place,types:[t]}).length}</span></div>
     ${es.length?es.map(e=>`<article class="cc"><h3>${e.title}</h3><div class="m"><span class="t-${t}">${when(e)}</span>${act(e,1)}</div><div class="m">${ptag(e.place)}${mgmeta(e)}</div></article>`).join(''):'<div class="empty">Brak wpisów.</div>'}</div>`}).join('');
  return `<main class="main"><header class="mh"><h1>Strona główna</h1><span class="sub">Dziś pon. 12.10.2026 · ${S.role==='mg'?'Mówisz jako':'Grasz jako'} ${CH[cur()].n}</span>
    <div class="r"><span class="ex">Dane przykładowe</span>${S.role==='mg'?'<button class="btn pri">+ Nowe ogłoszenie</button>':''}<span class="rolechip ${S.role==='mg'?'mg':''}">Podgląd: ${S.role==='mg'?'Mistrz Gry':'Gracz'}</span></div></header>
   <div class="c-grid"><div class="c-left">
     <div class="frow" style="flex:none"><span class="lbl">Typ</span>${tchips}</div>
     ${newsRow}
     <section class="c-map" aria-label="Mapa miejsc, kliknij miejsce aby filtrować">${svg}${nodes}<span class="cap">Mapa miejsc · przykład</span>
       <button class="btn sm reset" data-act="place" data-b="${id}" data-v="all">${bs.place==='all'?'Wszystkie miejsca ✓':'Pokaż wszystkie miejsca'}</button></section>
     <section class="c-strip"><div class="ph"><h2 class="sec">Kalendarz: ${placeName(bs)}</h2><span class="lbl">najbliższe terminy</span></div><div class="row">${strip}</div></section>
     <div class="c-cols" style="grid-template-columns:repeat(${Math.max(colTypes.length,1)},1fr)">${cols||'<div class="empty">Wybierz przynajmniej jeden typ wpisu.</div>'}</div>
   </div>
   <aside style="display:flex;flex-direction:column;gap:14px;min-height:0">${meCard(5)}</aside></div></main>`;
}

/* ---------- RENDER ---------- */
const BOARDS={A:{x:0,t:'Wariant A · Tablica',d:'Notatki przypięte do tablicy. Dla mnie i kalendarz zawsze z boku. Najbardziej klimatyczny, najmniej gęsty.',v:viewA},
              B:{x:1560,t:'Wariant B · Księga',d:'Rozkładówka dziennika: lista ogłoszeń po lewej, kalendarz miejsca po prawej, zakładki miejsc na krawędzi.',v:viewB},
              C:{x:3120,t:'Wariant C · Mapa miejsc',d:'Miejsca jako punkt wyjścia: mapa jest filtrem, wpisy w kolumnach według typu, pasek najbliższych terminów.',v:viewC}};
const world=$('#world');
for(const k in BOARDS){
  const b=BOARDS[k];
  world.insertAdjacentHTML('beforeend',`<div class="vlabel" style="left:${b.x}px"><b>${b.t}</b><span>${b.d}</span></div><div class="bd" id="bd${k}" style="left:${b.x}px"></div>`);
}
function render(){
  for(const k in BOARDS)$('#bd'+k).innerHTML=lpanel(k)+BOARDS[k].v();
  $('#r-player').setAttribute('aria-pressed',S.role==='player');
  $('#r-mg').setAttribute('aria-pressed',S.role==='mg');
}
render();

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el){let ch=false;for(const k in S.open)if(S.open[k]){S.open[k]=false;ch=true}
    if(ch&&!ev.target.closest('.chlist'))render();return}
  const a=el.dataset.act,v=el.dataset.v,b=el.dataset.b;
  if(a==='role'){S.role=v;S.open={};render()}
  else if(a==='theme'){const r=document.documentElement;v?r.setAttribute('data-theme',v):r.removeAttribute('data-theme');
    ['auto','light','dark'].forEach(t=>$('#th-'+t).setAttribute('aria-pressed',(v||'auto')===t))}
  else if(a==='place'){S.b[b].place=v;render()}
  else if(a==='type'){const t=S.b[b].types;const i=t.indexOf(v);i>=0?t.splice(i,1):t.push(v);render()}
  else if(a==='reset'){S.b[b].place='all';S.b[b].types=['news','holiday','event','recruit'];render()}
  else if(a==='month'){S.b[b].month=clamp(S.b[b].month+ +v,9,10);render()}
  else if(a==='join'){const id=+v;S.joined.has(id)?S.joined.delete(id):S.joined.add(id);render()}
  else if(a==='chtoggle'){const k=el.closest('.bd').id.slice(2);const o=!S.open[k];S.open={};S.open[k]=o;render()}
  else if(a==='pick'){S.char[S.role]=v;S.open={};render()}
  else if(a==='zoom'){const r=vp.getBoundingClientRect();zoomAt(v==='in'?1.25:.8,r.width/2,r.height/2)}
  else if(a==='fit'){v==='all'?fit(0,0,4560,1050):fit(BOARDS[v].x,0,1440,1050,true)}
});

/* ---------- PRZESUWANIE I ZOOM ---------- */
const vp=$('#vp');let view={x:0,y:0,s:.3};
function apply(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;$('#zl').textContent=Math.round(view.s*100)+'%'}
function zoomAt(f,cx,cy){const ns=clamp(view.s*f,.1,2.5),k=ns/view.s;view.x=cx-(cx-view.x)*k;view.y=cy-(cy-view.y)*k;view.s=ns;apply()}
function fit(x,y,w,h,anim=true){
  const r=vp.getBoundingClientRect(),top=(document.getElementById('bar').offsetHeight||60)+8,bot=70,pad=24;
  const s=clamp(Math.min((r.width-pad*2)/w,(r.height-top-bot)/h),.1,2.5);
  view.s=s;view.x=(r.width-w*s)/2-x*s;view.y=top+((r.height-top-bot)-h*s)/2-y*s;
  if(anim){world.classList.add('anim');setTimeout(()=>world.classList.remove('anim'),400)}
  apply();
}
vp.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.shiftKey&&!e.ctrlKey){view.x-=(e.deltaX||e.deltaY);apply();return}
  const r=vp.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX-r.left,e.clientY-r.top);
},{passive:false});
const ptrs=new Map();let last=null;
vp.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,a,input,select,textarea'))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});vp.setPointerCapture(e.pointerId);vp.classList.add('drag');last=null;
});
vp.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){view.x+=e.clientX-p.x;view.y+=e.clientY-p.y;apply()}
  else if(ptrs.size===2){
    const o=[...ptrs.entries()].find(([id])=>id!==e.pointerId)[1];
    const d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);
    const r=vp.getBoundingClientRect();if(d0>0)zoomAt(d1/d0,(e.clientX+o.x)/2-r.left,(e.clientY+o.y)/2-r.top);
  }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
const up=e=>{ptrs.delete(e.pointerId);if(!ptrs.size)vp.classList.remove('drag')};
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
document.addEventListener('keydown',e=>{
  if(e.target.closest('button'))return;
  const r=vp.getBoundingClientRect();
  if(e.key==='+'||e.key==='=')zoomAt(1.25,r.width/2,r.height/2);
  if(e.key==='-')zoomAt(.8,r.width/2,r.height/2);
  if(e.key==='0')fit(0,0,4560,1050);
});
fit(0,0,4560,1050,false);
</script>

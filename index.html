<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szczęśliwy Dzień</title>
<style>
  :root {
    --bg: #fff7f2; --card: #ffffff; --text: #3b2f35; --muted: #8a7a80;
    --accent: #ff7a9c; --accent2: #ffc36b; --soft: #ffe3ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1a1d; --card: #2a2327; --text: #f5e9ee; --muted: #b8a6ad;
      --accent: #ff8fab; --accent2: #ffcf85; --soft: #3a2c32;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 2rem; margin: 8px 0 4px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border-radius: 18px; padding: 20px;
    margin-bottom: 16px; box-shadow: 0 4px 18px rgba(0,0,0,.06);
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 10px 18px; font-size: 1rem; cursor: pointer;
  }
  button.ghost { background: var(--soft); color: var(--text); }
  .big { font-size: 1.2rem; min-height: 3em; margin: 0 0 12px; }
  .moods { display: flex; gap: 8px; flex-wrap: wrap; }
  .moods button { font-size: 1.6rem; background: var(--soft); padding: 8px 12px; }
  .moods button.on { outline: 3px solid var(--accent); }
  input[type=text] {
    width: 100%; padding: 10px 12px; border-radius: 12px; font-size: 1rem;
    border: 1px solid var(--soft); background: var(--bg); color: var(--text); margin-bottom: 8px;
  }
  ul { padding-left: 0; list-style: none; margin: 12px 0 0; }
  li { padding: 6px 0; border-bottom: 1px dashed var(--soft); }
  li small { color: var(--muted); }
  .task { display: flex; align-items: center; gap: 10px; }
  .task input { width: 22px; height: 22px; accent-color: var(--accent); }
  .circle {
    width: 140px; height: 140px; border-radius: 50%; margin: 8px auto 16px;
    background: radial-gradient(circle, var(--accent2), var(--accent));
    transform: scale(.6); transition: transform 4s ease-in-out;
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600;
  }
  .center { text-align: center; }
  .confetti { position: fixed; top: -20px; font-size: 1.5rem; pointer-events: none;
    animation: fall 3s linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: .7; } }
</style>
</head>
<body>
<main>
  <h1>Szczęśliwy Dzień ☀️</h1>
  <p class="sub" id="greeting"></p>

  <section class="card">
    <h2>Jak się dziś czujesz?</h2>
    <div class="moods" id="moods"></div>
    <p id="moodReply" class="sub" style="margin:12px 0 0"></p>
  </section>

  <section class="card">
    <h2>💌 Wiadomość dla Ciebie</h2>
    <p class="big" id="compliment"></p>
    <button id="nextCompliment">Jeszcze jedna</button>
  </section>

  <section class="card">
    <h2>🌱 Trzy małe rzeczy na dziś</h2>
    <div id="tasks"></div>
    <button class="ghost" id="newTasks" style="margin-top:12px">Wylosuj inne</button>
  </section>

  <section class="card">
    <h2>🙏 Za co jesteś dziś wdzięczna?</h2>
    <input type="text" id="gratitudeInput" placeholder="np. za ciepłą herbatę rano">
    <button id="addGratitude">Zapisz</button>
    <ul id="gratitudeList"></ul>
  </section>

  <section class="card center">
    <h2>🌬️ Minuta oddechu</h2>
    <div class="circle" id="circle">gotowa?</div>
    <button id="breathe">Zaczynamy</button>
  </section>
</main>

<script>
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // Powitanie
  const h = new Date().getHours();
  document.getElementById('greeting').textContent =
    h < 5 ? 'Późno już — zadbaj o sen, jutro też jest dzień 🌙' :
    h < 12 ? 'Dzień dobry! Dzisiejszy dzień zaczyna się od Ciebie.' :
    h < 18 ? 'Miłego popołudnia! Zrób sobie chwilę przerwy.' :
    'Dobry wieczór! Czas zwolnić i docenić dzisiejszy dzień.';

  // Nastrój
  const moods = {
    '😄': 'Cudownie! Zapamiętaj, co sprawiło, że tak się czujesz.',
    '🙂': 'Dobrze jest! Może jedna mała przyjemność na deser?',
    '😐': 'Takie dni też są w porządku. Spróbuj minuty oddechu poniżej.',
    '😔': 'Przytulam mocno 🤗 Bądź dziś dla siebie łagodna.',
    '😢': 'Smutek też ma prawo być. Napisz do kogoś bliskiego — nie musisz być z tym sama.'
  };
  const moodsEl = document.getElementById('moods');
  Object.keys(moods).forEach(m => {
    const b = document.createElement('button');
    b.textContent = m;
    b.onclick = () => {
      moodsEl.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      document.getElementById('moodReply').textContent = moods[m];
    };
    moodsEl.appendChild(b);
  });

  // Komplementy
  const compliments = [
    'Jesteś wystarczająca dokładnie taka, jaka jesteś.',
    'Twój uśmiech naprawdę rozjaśnia pokój.',
    'Radzisz sobie lepiej, niż Ci się wydaje.',
    'Świat jest odrobinę lepszy, bo w nim jesteś.',
    'Masz prawo odpocząć. Odpoczynek to też postęp.',
    'Ktoś dziś pomyślał o Tobie ciepło — na pewno.',
    'Każdy mały krok się liczy. Twój też.',
    'Twoja wrażliwość to supermoc, nie słabość.',
    'Zasługujesz na te same dobre słowa, które dajesz innym.',
    'Nie musisz być idealna, żeby być wspaniała.',
    'Dzisiejszy dzień nie musi być perfekcyjny, żeby był dobry.',
    'Jesteś bohaterką swojej historii — i to piękna historia.'
  ];
  const compEl = document.getElementById('compliment');
  const showCompliment = () => {
    let c; do { c = pick(compliments); } while (c === compEl.textContent);
    compEl.textContent = c;
  };
  document.getElementById('nextCompliment').onclick = showCompliment;
  showCompliment();

  // Małe zadania
  const ideas = [
    'Wypij szklankę wody 💧', 'Wyjdź na 10-minutowy spacer 🚶‍♀️',
    'Włącz ulubioną piosenkę i potańcz 💃', 'Napisz miłą wiadomość do przyjaciółki 📱',
    'Przeciągnij się porządnie 🧘‍♀️', 'Zjedz coś pysznego, powoli 🍓',
    'Otwórz okno i weź 5 głębokich oddechów 🌬️', 'Zrób sobie ulubioną herbatę ☕',
    'Posprzątaj jedną małą rzecz 🧺', 'Obejrzyj zdjęcie, które przywołuje dobre wspomnienie 📷',
    'Powiedz sobie w lustrze coś miłego 🪞', 'Przeczytaj kilka stron książki 📖',
    'Pogłaszcz zwierzaka (swojego lub cudzego) 🐶', 'Idź dziś wcześniej spać 😴'
  ];
  const tasksEl = document.getElementById('tasks');
  const drawTasks = () => {
    const shuffled = [...ideas].sort(() => Math.random() - .5).slice(0, 3);
    tasksEl.innerHTML = '';
    shuffled.forEach(t => {
      const label = document.createElement('label');
      label.className = 'task';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.onchange = () => {
        if ([...tasksEl.querySelectorAll('input')].every(x => x.checked)) celebrate();
      };
      label.append(cb, document.createTextNode(t));
      tasksEl.appendChild(label);
    });
  };
  document.getElementById('newTasks').onclick = drawTasks;
  drawTasks();

  // Wdzięczność
  const gInput = document.getElementById('gratitudeInput');
  const gList = document.getElementById('gratitudeList');
  const renderGratitude = () => {
    gList.innerHTML = '';
    store.get('gratitude', []).slice().reverse().forEach(g => {
      const li = document.createElement('li');
      const small = document.createElement('small');
      small.textContent = ' — ' + g.date;
      li.append(document.createTextNode(g.text), small);
      gList.appendChild(li);
    });
  };
  const addGratitude = () => {
    const text = gInput.value.trim();
    if (!text) return;
    const list = store.get('gratitude', []);
    list.push({ text, date: new Date().toLocaleDateString('pl-PL') });
    store.set('gratitude', list);
    gInput.value = '';
    renderGratitude();
    celebrate();
  };
  document.getElementById('addGratitude').onclick = addGratitude;
  gInput.addEventListener('keydown', e => { if (e.key === 'Enter') addGratitude(); });
  renderGratitude();

  // Oddech: 4 s wdech, 4 s wydech, przez minutę
  const circle = document.getElementById('circle');
  const breatheBtn = document.getElementById('breathe');
  breatheBtn.onclick = () => {
    breatheBtn.disabled = true;
    let step = 0;
    const tick = () => {
      if (step >= 15) {
        circle.style.transform = 'scale(.6)';
        circle.textContent = 'brawo 💛';
        breatheBtn.disabled = false;
        return;
      }
      const inhale = step % 2 === 0;
      circle.style.transform = inhale ? 'scale(1)' : 'scale(.6)';
      circle.textContent = inhale ? 'wdech' : 'wydech';
      step++;
      setTimeout(tick, 4000);
    };
    tick();
  };

  // Konfetti
  function celebrate() {
    const emojis = ['🎉', '💖', '🌸', '✨', '🌈', '☀️'];
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = pick(emojis);
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDelay = Math.random() * .8 + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 4000);
    }
  }
</script>
</body>
</html>
